apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/Sass0nX/mylabcompany.git
      targetRevision: main
      path: charts/frontend
      helm:
        valueFiles:
          - $values/values/frontend/values.yaml
    - repoURL: https://github.com/Sass0nX/mylabcompany.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend
  syncPolicy:
    automated:
      prune: true
      selfHeal: true