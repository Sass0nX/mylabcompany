apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: frontend
  namespace: argocd

spec:
  project: default

  sources:
    # Helm Chart מתוך Git
    - repoURL: https://github.com/Sass0nX/mylabcompany.git
      targetRevision: main
      path: charts/frontend

      helm:
        valueFiles:
          - $values/values/frontend/values.yaml

    # Values source
    - repoURL: https://github.com/Sass0nX/mylabcompany.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: frontend

  syncPolicy:
    automated:
      prune: true
      selfHeal: true