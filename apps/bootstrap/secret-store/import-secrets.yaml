apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-oidc2
    creationPolicy: Owner

  data:
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc
        property: client-secret