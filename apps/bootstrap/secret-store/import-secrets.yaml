apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: grafana-credentials-admin
        property: username

    - secretKey: password
      remoteRef:
        key: grafana-credentials-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: argocd-credentials
  namespace: argocd

spec:
  refreshPolicy: CreatedOnce

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: argocd-secret
    creationPolicy: Merge

    template:
      engineVersion: v2
      data:
        admin.password: "{{ .password | bcrypt }}"
        admin.passwordMtime: '{{ now | date "2006-01-02T15:04:05Z07:00" }}'

  data:
    - secretKey: password
      remoteRef:
        key: argocd-credentials-admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-oidc
    creationPolicy: Owner

  data:
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-client-secret
        property: client-secret