apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: grafana-admin-credential
        property: username

    - secretKey: password
      remoteRef:
        key: grafana-admin-credential
        property: password
---
