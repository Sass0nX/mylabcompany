apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: grafana-login-credentials
        property: username

    - secretKey: password
      remoteRef:
        key: grafana-login-credentials
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-credentials
  namespace: argocd
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: argocd-secret
    creationPolicy: Merge

  data:
    - secretKey: admin.password
      remoteRef:
        key: argocd-login-credentials
        property: passwordHash
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-oidc
    creationPolicy: Owner

  data:
    - secretKey: client-secret
      remoteRef:
        key: grafana-oidc-secret
        property: client-secret