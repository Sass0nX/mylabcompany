apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-credentials
  namespace: monitor
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: grafana-credentials
    creationPolicy: Owner

  data:
    - secretKey: username
      remoteRef:
        key: grafana-login-credentials
        property: username

    - secretKey: password
      remoteRef:
        key: grafana-login-credentials
        property: password
---
